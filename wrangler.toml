# Production (default) — used by `wrangler deploy`
name = "perler-beads"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[d1_databases]]
binding = "perler_beads"
database_name = "perler-beads"
database_id = "28ded290-d9a2-4877-8583-c1a52608c8d5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "perler_beads_assets"
bucket_name = "perler-beads-assets"

# Development — used by local `next dev`
# D1 默认走本地 SQLite（remote=false）：remote=true 在系统代理下经常挂死 getCloudflareContext/D1 查询。
# 需要连云端开发库时再临时改 remote = true，并确保代理放行 Cloudflare API。
[env.development]
name = "perler-beads-dev"

[[env.development.d1_databases]]
binding = "perler_beads"
database_name = "perler-beads-dev"
database_id = "38031e71-be11-499a-a88f-4892543076c4"
migrations_dir = "migrations"
remote = false

[[env.development.r2_buckets]]
binding = "perler_beads_assets"
bucket_name = "perler-beads-assets-dev"
remote = false
